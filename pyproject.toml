[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pybuzzsprout"
version = "0.1.2"
description = "Python client library and CLI for the Buzzsprout podcast API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "Embersilk LLC", email = "dev@embersilk.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Multimedia :: Sound/Audio",
    "Framework :: Pydantic",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests",
    "click",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "responses",
    "flake8",
]

[project.scripts]
buzzsprout = "pybuzzsprout.cli:cli"

[project.urls]
Homepage = "https://github.com/embersilk-labs/pybuzzsprout"
Repository = "https://github.com/embersilk-labs/pybuzzsprout"
